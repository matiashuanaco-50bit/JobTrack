<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JobTrack</title>
    <meta
      name="description"
      content="Dashboard moderno para gestionar postulaciones laborales."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <div class="brand-mark">J</div>
          <div class="brand-copy">
            <p class="eyebrow">Career dashboard</p>
            <h1>JobTrack</h1>
          </div>
        </div>

        <div class="header-pill">
          <span class="pulse-dot"></span>
          Seguimiento activo
        </div>
      </header>

      <section
        class="stats"
        id="stats-container"
        aria-live="polite"
        aria-label="Resumen de postulaciones"
      ></section>

      <main class="layout">
        <aside class="panel">
          <div class="panel-header">
            <div>
              <p class="section-kicker">Nueva</p>
              <h2>Agregar postulación</h2>
            </div>
          </div>

          <form id="application-form" class="job-form" novalidate>
            <div class="field">
              <label for="company">Empresa</label>
              <input
                id="company"
                name="company"
                type="text"
                placeholder="Ej: Mercado Libre"
                required
              />
            </div>

            <div class="field">
              <label for="role">Rol</label>
              <input
                id="role"
                name="role"
                type="text"
                placeholder="Ej: Frontend Developer"
                required
              />
            </div>

            <div class="field">
              <label for="date">Fecha de postulación</label>
              <input id="date" name="date" type="date" required />
            </div>

            <div class="field">
              <label for="state">Estado inicial</label>
              <select id="state" name="state">
                <option value="Enviado" selected>Enviado 📩</option>
                <option value="En proceso">En proceso 🔄</option>
                <option value="Rechazado">Rechazado ❌</option>
                <option value="Oferta">Oferta 🎉</option>
              </select>
            </div>

            <button type="submit" class="primary-btn">Guardar postulación</button>
          </form>
        </aside>

        <section class="panel list-panel">
          <div class="toolbar">
            <div class="search-wrap">
              <svg
                aria-hidden="true"
                viewBox="0 0 24 24"
                width="18"
                height="18"
              >
                <path
                  d="M10.5 3a7.5 7.5 0 015.924 12.7l4.38 4.38 1.414-1.414-4.38-4.38A7.5 7.5 0 1110.5 3zm0 2a5.5 5.5 0 104.1 9.39A5.5 5.5 0 0010.5 5z"
                  fill="currentColor"
                />
              </svg>
              <input
                id="search-input"
                type="search"
                placeholder="Buscar empresa o rol..."
                aria-label="Buscar postulaciones"
              />
            </div>

            <div class="filter-wrap">
              <label class="sr-only" for="status-filter">Filtrar por estado</label>
              <select id="status-filter" aria-label="Filtrar por estado">
                <option value="all">Todos</option>
              </select>
            </div>
          </div>

          <div id="application-list" class="application-list" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <div id="edit-modal" class="modal-backdrop hidden" aria-hidden="true">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-header">
          <h3 id="modal-title">Editar postulación</h3>
          <button
            type="button"
            class="icon-btn"
            id="close-modal"
            aria-label="Cerrar modal"
          >
            ×
          </button>
        </div>

        <form id="edit-form" class="job-form">
          <div class="field">
            <label for="edit-company">Empresa</label>
            <input id="edit-company" name="company" type="text" required />
          </div>

          <div class="field">
            <label for="edit-role">Rol</label>
            <input id="edit-role" name="role" type="text" required />
          </div>

          <div class="field">
            <label for="edit-date">Fecha de postulación</label>
            <input id="edit-date" name="date" type="date" required />
          </div>

          <div class="field">
            <label for="edit-state">Estado</label>
            <select id="edit-state" name="state">
              <option value="Enviado">Enviado 📩</option>
              <option value="En proceso">En proceso 🔄</option>
              <option value="Rechazado">Rechazado ❌</option>
              <option value="Oferta">Oferta 🎉</option>
            </select>
          </div>

          <div class="modal-actions">
            <button type="button" class="secondary-btn" id="cancel-edit">
              Cancelar
            </button>
            <button type="submit" class="primary-btn">Guardar cambios</button>
          </div>
        </form>
      </div>
    </div>

    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <script src="script.js"></script>
  </body>
</html>
